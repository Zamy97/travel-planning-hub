<section class="overview">
  <div class="overview__head">
    <div>
      <h2>Map of saved places</h2>
      <p>Pan and zoom the whole list. Expand a trip below for stop-by-stop routing.</p>
    </div>
    <ul class="overview__legend" aria-label="Status colors">
      <li><span class="dot dot--planning"></span> Planning</li>
      <li><span class="dot dot--wishlist"></span> Wishlist</li>
      <li><span class="dot dot--visited"></span> Visited</li>
    </ul>
  </div>
  <div #mapHost class="overview__canvas" role="img" aria-label="Overview map of saved places"></div>
</section>
